---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monitor-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panscaler-monitor
  namespace: default
  labels:
    app: panscaler-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panscaler-monitor
  template:
    metadata:
      labels:
        app: panscaler-monitor
    spec:
      containers:
      - name: monitor
        image: lorenzobacchiani/panscaler_monitor
        imagePullPolicy: Always
        env:
        - name: POLL_INTERVAL
          value: "45"
        - name: PROMETHEUS_TARGET
          value: "http://prometheus.istio-system.svc.cluster.local:9090"
        - name: NAMESPACE
          value: "default"
        - name: DEPLOYMENTS
          value: "frontend|cartservice|productcatalogservice|currencyservice|paymentservice|shippingservice|emailservice|checkoutservice|recommendationservice|adservice"
        - name: WORKLOAD_DELTA_THRESHOLD
          value: "0.3"
        - name: WINDOW_SIZE
          value: "10"
        - name: SLO_LATENCY_MS
          value: "500"
        - name: OUTPUT_DIR
          value: "/data"
        - name: EXPERIMENT_NAME
          value: "panscaler-experiment"
        - name: COST_PER_POD_HOUR
          value: "0.00416"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: monitor-data