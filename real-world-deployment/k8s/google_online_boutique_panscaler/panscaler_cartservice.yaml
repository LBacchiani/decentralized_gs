apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice-autoscaler
  namespace: default
  labels:
    app: cartservice-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice-autoscaler
  template:
    metadata:
      labels:
        app: cartservice-autoscaler
    spec:
      serviceAccountName: scaler-sa
      containers:
        - name: cartservice-autoscaler
          image: lorenzobacchiani/panscaler:latest
          imagePullPolicy: Always
          env:
            - name: ENTRYPOINT
              value: "frontend"
            - name: SERVICE_NAME
              value: "cartservice"
            - name: PROMETHEUS_URL
              value: "http://prometheus.istio-system.svc.cluster.local:9090"
            - name: POLL_INTERVAL
              value: "45"
            - name: MIN_INSTANCES
              value: "1"
            - name: SYS_THRESHOLD_MS
              value: "1500"
            - name: CPU_SLO
              value: "0.6"
            - name: PLATEAU_WINDOWS
              value: "2"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
