apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice-autoscaler
  namespace: default
  labels:
    app: emailservice-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emailservice-autoscaler
  template:
    metadata:
      labels:
        app: emailservice-autoscaler
    spec:
      serviceAccountName: scaler-sa
      containers:
        - name: emailservice-autoscaler
          image: lorenzobacchiani/panscaler:latest
          imagePullPolicy: Always
          env:
            - name: ENTRYPOINT
              value: "frontend"
            - name: SERVICE_NAME
              value: "emailservice"
            - name: PROMETHEUS_URL
              value: "http://prometheus.istio-system.svc.cluster.local:9090"
            - name: POLL_INTERVAL
              value: "45"
            - name: MIN_INSTANCES
              value: "1"
            - name: THROUGHPUT_EPSILON
              value: "0.02"
            - name: LATENCY_THRESHOLD_MS
              value: "500"
            - name: PLATEAU_WINDOWS
              value: "2"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
