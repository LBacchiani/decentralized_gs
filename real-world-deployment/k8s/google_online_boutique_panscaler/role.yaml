apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaler-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaler-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaler-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: scaler-sa
  namespace: default
roleRef:
  kind: Role
  name: scaler-role
  apiGroup: rbac.authorization.k8s.io

